[package]
name = "acme-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "acme-api"
path = "src/main.rs"

[dependencies]
core = { path = "../core", package = "acme-core" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
insta = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
