name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx biome ci .
      - run: npm run lint:docs

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build # tsdown build --publint --attw
      - run: npx attw --pack --profile node16
      - run: npx publint
      # pack, not publish --dry-run: npm 11 refuses a dry run of an already
      # published version, which would fail every PR after a release.
      - run: npm pack --dry-run
      - run: test -x dist/platform-map.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            package.json

  test:
    needs: [build]
    strategy:
      matrix:
        runtime: [node, bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist }
      - if: matrix.runtime != 'bun'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci --omit=dev
      - if: matrix.runtime != 'bun'
        run: npm test
      # Bun cannot run the files in test/: its node:test support rejects a test
      # that starts while another one is still running (oven-sh/bun#5090), and
      # several files here do that. So the Node lanes run test/, and this lane
      # runs the small Bun-native suite in test-bun/ against the built package
      # to prove it works on Bun.
      - if: matrix.runtime == 'bun'
        run: bun test test-bun/

  # Release-triggered OIDC trusted publishing. Tag-gated; keyless —
  # id-token:write mints the short-lived OIDC token; keyless — no stored token.
  # Provenance auto-attaches from publishConfig.provenance:true. The @spec-engine
  # trusted publisher must be registered on npmjs.com before the first tagged
  # run (a one-time operator step on npmjs.com; CI cannot do it).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing + provenance require npm >= 11.5.1. Node 22
      # bundles npm 10.9.x (NOT >= 11.5.1), so upgrade npm explicitly before
      # publishing — otherwise keyless publish falls back to token auth and
      # fails ENEEDAUTH. Node >=22.14.0 alone does NOT satisfy the npm floor.
      - run: npm install -g npm@^11.5.1
      - run: npm --version # assert the upgrade took (must be >= 11.5.1)
      # publish the EXACT dist/ the build job produced and the test job
      # validated — download that artifact instead of rebuilding, so the
      # published tarball cannot drift from what passed the pre-release gate
      # (build --publint/--attw + test). Provenance still
      # attaches: OIDC provenance needs a trusted CI publish context, not an
      # in-job rebuild. LICENSE/README come from the checkout; dist/ + the
      # validated package.json come from the artifact.
      - uses: actions/download-artifact@v8
        with: { name: dist }
      - run: npm publish # keyless OIDC (no stored token) + automatic provenance
