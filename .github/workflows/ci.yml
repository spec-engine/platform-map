name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx biome ci .

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm } # tsdown requires Node >=22.18
      - run: npm ci
      - run: npm run build # tsdown build --publint --attw
      - run: npx attw --pack --profile node16
      - run: npx publint
      - run: npm publish --dry-run
      - run: test -x dist/platform-map.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            package.json

  test:
    needs: [build]
    strategy:
      matrix:
        runtime: [node20, node22, bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist }
      - if: matrix.runtime != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime == 'node20' && '20' || '22' }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci --omit=dev
      - if: matrix.runtime != 'bun'
        run: node --test
      # D-05 amendment: node:test does not run unmodified under `bun test`
      # (oven-sh/bun#5090 — "test() inside another test()"), falsifying
      # 01-RESEARCH.md's original assumption. test/*.test.js stays node:test
      # -only (Node 20/22 lanes above); this lane runs a separate bun:test
      # smoke suite (test-bun/) against the built dist/ artifact instead,
      # which still proves BUILD-04's intent under the real Bun runtime.
      # See test-bun/smoke.bun.spec.mjs for the full rationale.
      - if: matrix.runtime == 'bun'
        run: bun test test-bun/

  # PUB-02: tarball cold-install smoke — packs the built package and installs
  # the packed tarball into scratch Node-CJS + Bun projects (public exports +
  # CLI bin only). The only job that catches a bundle-leak into an unshipped
  # chunk; no live-registry access.
  cold-install-smoke:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm ci
      - run: npm run build
      - run: node scripts/cold-install-smoke.mjs

  # PUB-01: release-triggered OIDC trusted publishing. Tag-gated; keyless —
  # id-token:write mints the short-lived OIDC token; keyless — no stored token.
  # Provenance auto-attaches from publishConfig.provenance:true. The @spec-engine
  # trusted publisher must be registered on npmjs.com before the first tagged
  # run (operator gate — see 05-LEARNINGS.md).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, cold-install-smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # REQUIRED for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing + provenance require npm >= 11.5.1. Node 22
      # bundles npm 10.9.x (NOT >= 11.5.1), so upgrade npm explicitly before
      # publishing — otherwise keyless publish falls back to token auth and
      # fails ENEEDAUTH. Node >=22.14.0 alone does NOT satisfy the npm floor.
      - run: npm install -g npm@^11.5.1
      - run: npm --version # assert the upgrade took (must be >= 11.5.1)
      - run: npm ci
      - run: npm run build
      - run: npm publish # keyless OIDC (no stored token) + automatic provenance
